name: Green Audit CI

on: [push]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Carbon Audit
        run: |
          # We call the predictor script directly. 
          # If prediction > threshold, exit 1 to fail the build.
          python -c "from app.predictor import predictor; res = predictor.predict_run(120); print(f'Predicted: {res}kg'); exit(1) if res > 100 else exit(0)"